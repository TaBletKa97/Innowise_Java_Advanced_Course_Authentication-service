spring:
  application:
    name: Innowise_Java_Advanced_Course_Authentication-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATABASE_URL:jdbc:postgresql://localhost:5433/postgres}
    username: ${SPRING_DATABASE_USERNAME:postgres}
    password: ${SPRING_DATABASE_PASSWORD:postgres}

  liquibase:
    change-log: classpath:/db/changelog/main-changelog.xml
    enabled: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6380}

  cache:
    type: redis

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  access-lifetime: 30m
  refresh-lifetime: 300m
